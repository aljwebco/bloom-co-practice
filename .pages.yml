
media:
  input: images
  output: /images

content:
  - name: website
    label: Website Information
    type: file
    path: content.json
    format: json
    fields:
      - name: businessName
        label: Business Name
        type: string

      - name: heroTitle
        label: Homepage Heading
        type: string

      - name: heroDescription
        label: Homepage Description
        type: text

      - name: aboutText
        label: About Us
        type: text

      - name: services
        label: Services
        type: string
        list: true

      - name: email
        label: Email Address
        type: string

      - name: phone
        label: Phone Number
        type: string

      - name: hours
        label: Business Hours
        type: string
